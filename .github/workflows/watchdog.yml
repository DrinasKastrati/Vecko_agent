name: Watchdog (tysta fel -> issue)

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 12:30 CEST vardagar – efter routiner (07:47/08:40 lokal) + auto-push
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Kontrollera färskhet (LLM-fritt, inga tokens)
        run: node .github/scripts/watchdog.mjs
      # Issues speglar NULAGET: nya problem oppnas, atgardade stangs.
      # Dedupen matchade tidigare pa TITEL, och watchdog-titlar bar antal
      # ("5 prissatt(a) bubblare utan avgorande"). Gick antalet 5 -> 3 lastes
      # det som ett nytt problem: ett andra issue oppnades och det forsta lag
      # kvar. Nyckeln (p.key) ar stabil och ligger nu i brodtexten.
      - name: Synka issues mot problemlistan (oppna nya, stang atgardade)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const S = await import(process.env.GITHUB_WORKSPACE + '/.github/scripts/issue-sync.mjs');
            let problems = [];
            try { problems = JSON.parse(fs.readFileSync((process.env.RUNNER_TEMP || '.') + '/watchdog.json', 'utf8')); } catch (e) {}
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const plan = S.planIssues(open.data, problems, 'watchdog');
            for (const p of plan.open) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title: p.title,
                body: [p.body,
                       '_Automatisk vakthund (LLM-fri). Stangs av sig sjalv nar orsaken ar borta._',
                       S.keyMarker('watchdog', p.key)].join('\n\n') });
              core.info('Oppnade: ' + p.key);
            }
            for (const c of plan.close) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: c.number, body: 'Kontrollen ar frisk igen vid senaste korningen. Stangs automatiskt.' });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: c.number, state: 'closed' });
              core.info('Stangde: ' + c.key);
            }
            core.info(`Problem: ${problems.length} - oppnade ${plan.open.length}, stangde ${plan.close.length}.`);
