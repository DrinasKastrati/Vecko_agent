name: Hämta kurser (prices.json)

on:
  schedule:
    # MINUTVALET ÄR MEDVETET (2026-08-31). GitHub deprioriterar schemalagda
    # körningar vid hög last och startar dem då INTE ALLS – minut 0 på en hel
    # timme är den mest översökta minuten som finns. Mätt 2026-08-31 startade
    # 0 av 2 rotationskritiska crons (05:00 och 06:00 UTC), medan samtliga
    # STARTADE körningar hade conclusion success; det var alltså inget kodfel
    # att leta efter. Crons ligger därför bredvid hela timmen.
    # Ett test i tests/theme.mjs vaktar att ingen kryper tillbaka till minut 0.
    #
    # 1. Var 30:e minut 07–20 UTC på vardagar – täcker den aktiva handelsdagen
    #    för både Europa och USA.
    - cron: "7,37 7-20 * * 1-5"

    # 2. Stängningstiderna ligger kvar för att garantera exakt rätt minut
    - cron: "9 5 * * 1-5"    # ~07:00 CEST vardagar – FÖRE rotationerna
    - cron: "9 6 * * 1-5"    # extra säkerhetskörning
    - cron: "45 16 * * 1-5"  # efter Stockholm-stängning – riktiga stängningskurser i price_history
    - cron: "10 21 * * 1-5"  # efter US-stängning (16:00 ET) – scout/krypto-kurser

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full historik – krävs för att rebase mot nya pushar ska funka
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # DYGNSGRINDEN (2026-08-31) – ersätter grindningen på en exakt cron-sträng.
      #
      # Stegen nedan hör hemma en gång per dygn och var grindade på
      # `github.event.schedule == '0 5 * * 1-5'`. Uteblir just DEN körningen körs
      # de inte alls det dygnet, trots att fjorton senare körningar passerar –
      # exakt det som hände 2026-08-31, då varken rapportkalendern eller
      # backfillen kördes en enda gång.
      #
      # Grinden ligger nu i DATAT: `state/prices.json`:s `wideAt` är tidsstämpeln
      # för senaste BREDA hämtningen. Är den från ett tidigare dygn återstår
      # dagens första körning, och nästa körning tar igen den av sig själv.
      # Markören sätts av den breda hämtningen SJÄLV och inte av ett
      # continue-on-error-steg – ett sådant kunde faila en hel dag och göra varje
      # halvtimmeskörning bred, alltså 110 extra Yahoo-anrop var 30:e minut.
      - name: Dygnsgrind – återstår dagens första körning?
        id: dygnsgrind
        run: |
          FORSTA=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { needsDailyRun } from './.github/scripts/fetch-prices.mjs';
            let at = null;
            try { at = JSON.parse(readFileSync('state/prices.json','utf8')).wideAt || null; } catch {}
            process.stdout.write(needsDailyRun(at, new Date().toISOString().slice(0,10)) ? 'true' : 'false');
          ")
          echo "forsta=$FORSTA" >> "$GITHUB_OUTPUT"
          echo "Dagens första körning återstår: $FORSTA"
      # Rapportkalendern hämtas FÖRE kurserna: fetch-prices.mjs läser dess
      # `upcoming`-lista och tar med varje symbol som rapporterar inom 10
      # handelsdagar, så att en verifierad kurs finns INNAN rapporten släpps.
      # Ordningen är alltså inte godtycklig – körs den efteråt slår tillägget
      # igenom först nästa hämtning, vilket är exakt den fördröjning som gjorde
      # att PLTR saknade kurs på rapportdagen 2026-08-03.
      #
      # Bara på dagens första körning: rapportdatum ändras inte var halvtimme,
      # och quoteSummary kräver cookie+crumb per körning. Faller den ska
      # kursbevakningen inte falla med den – därav continue-on-error, och
      # skriptet lämnar filen ORÖRD vid fel i stället för att skriva en tom
      # kalender (en tom kalender läses som "inga rapporter på väg").
      - name: Hämta rapportkalender
        if: steps.dygnsgrind.outputs.forsta == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node .github/scripts/earnings-calendar.mjs
      # DAGENS FÖRSTA KÖRNING TAR MED HELA MOVERS-UNIVERSUMET (2026-08-31).
      #
      # config/universe_nordic_movers.txt bär 110 nordiska symboler som movers.mjs
      # hämtade varje lördag utan att en enda av dem nådde state/prices.json.
      # Grind 1 ("verifierad kurs med källa + tidsstämpel") fällde därför per
      # konstruktion varje mover som inte handkopierats till config/watchlist.txt
      # i efterhand: 25 av 82 nordiska bruttokandidater över v34–v36, och i v36
      # var de tio fällda veckans FEM största rörelser plus veckans FEM starkaste
      # bekräftade katalysatorer.
      #
      # BARA här och inte var 30:e minut: 110 extra Yahoo-anrop per halvtimme är
      # varken gratis eller ofarligt – Yahoo svarar 403 när listan blir för lång.
      - name: Hämta kurser (dagens första – hela movers-universumet med)
        if: steps.dygnsgrind.outputs.forsta == 'true'
        run: node .github/scripts/fetch-prices.mjs --wide
      - name: Hämta kurser
        if: steps.dygnsgrind.outputs.forsta != 'true'
        run: node .github/scripts/fetch-prices.mjs
      # Backfill av symboler med KORT serie. Löser åtgärdspunkt 1 i
      # veckorapport-260817: backfill-history.mjs fanns sedan 2026-08-03 men
      # anropades av INGEN workflow, så en nyinlagd ticker startade på 1 punkt
      # och växte en per handelsdag. Grind 2 kräver 15 punkter (RSI) och ~35
      # (MACD), alltså tre veckor innan en färsk kandidat går att poängsätta –
      # 12 av 27 bruttokandidater i v34 föll på just det.
      #
      # EFTER hämtningen, inte före: symboler som kommer in via rapporter,
      # kandidatfilen eller rapportkalendern finns då redan i price_history med
      # sin första punkt, och backfillens collectSymbols läser bara historiken
      # + watchlists. Körs den före missas de ett dygn.
      #
      # Bara på dagens första körning (och manuellt): historik för gamla dagar ändras
      # inte var halvtimme, och varje symbol kostar ett eget Yahoo-anrop.
      # Skriptet har eget tak per körning (40 symboler, kortast serie först) och
      # rör aldrig `backfilledAt` i detta läge. Faller den ska INTE
      # kursbevakningen falla med den.
      - name: Backfilla symboler med kort historik
        if: steps.dygnsgrind.outputs.forsta == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        #
        # `--cap=120` (2026-08-31) i stället för standardtaket 40: movers-universumet
        # lade till 75 symboler på en gång, alla med EN historikpunkt, och med tak 40
        # hade ikapphämtningen tagit två dygn. Under dem larmar
        # `watchdog.mjs:checkShortSeries` (tolerated = 2) "backfill-refused" med
        # orsaken "Yahoo levererar inte historiken (403/404 per symbol)" – vilket är
        # FEL. Ett larm som pekar på fel sak bränner den uppmärksamhet nästa larm
        # behöver. Taket kostar inget i normalläge: urvalet returnerar bara symboler
        # som FAKTISKT är korta, och den listan är nästan tom när alla är ifyllda.
        run: node .github/scripts/backfill-history.mjs --missing=200 --cap=120 1y
      # Beslutsutvärderingen är en REN FUNKTION av decisions.json + price_history.json
      # och hör därför hemma direkt efter hämtningen: den färska historiken är precis
      # det som gör ett tidigare beslut moget att mäta. LLM-fritt, ingen nätåtkomst,
      # några millisekunder. Faller den ska INTE kursbevakningen falla med den.
      - name: Utvärdera beslutsloggen mot efterföljande kurs
        continue-on-error: true
        run: node .github/scripts/decision_eval.mjs
      # Kandidatkurserna fylls EFTER hämtningen: det är den färska prices.json
      # som avgör om en kandidats katalysator hunnit få en kurs efter sig.
      # Fyller bara från en bevisligen post-event-kurs – se skriptets huvud.
      # Faller den ska INTE kursbevakningen falla med den.
      - name: Fyll kandidatkurser ur post-event-kurs
        continue-on-error: true
        run: node .github/scripts/refresh-candidate-prices.mjs
      - name: Committa prices.json om ändrad
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/prices.json state/price_history.json state/volume_history.json state/decision_eval.json state/earnings_calendar.json state/scout_candidates.json
          if git diff --cached --quiet; then
            echo "Inga kursandringar - hoppar over commit."
          else
            git commit -m "Kurser: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push origin main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push-försök $i misslyckades (kollision med annan push?) – försöker igen..."
              sleep $((5 * i))
            done
            echo "Kunde inte pusha efter 3 försök."
            exit 1
          fi	
