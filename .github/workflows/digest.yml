name: Daglig digest (issue -> e-post)

on:
  # SCHEMAT ÄR DET SOM FAKTISKT KÖR DEN. Push-triggern nedan gick ALDRIG igång
  # för robotens egna rapporter: GitHub startar medvetet inga workflows för
  # pushar gjorda med den inbyggda GITHUB_TOKEN, och rapporterna når main via
  # auto_merge.yml med just den token. Följden var att digesten byggdes, testades
  # och låg klar – men aldrig kördes en enda gång mellan 2026-07-31 och
  # 2026-08-07. Ingenting blev rött; workflow-listan var bara tom.
  #
  # 07:30 UTC: nordiska rotationen skriver sin rapport ~06:49, så 40 minuters
  # marginal räcker även när GitHubs cron är försenad (den är best-effort).
  # 12:00 UTC: skyddsnät om rotationen kom sent. digest.mjs skriver `null` när
  # dagens rapport saknas, och issue-steget har dubblettskydd på titeln, så en
  # extra körning är gratis och kan aldrig ge två mejl.
  schedule:
    - cron: "30 7 * * 1-5"
    - cron: "0 12 * * 1-5"
  # BEHÅLLS ändå: den fungerar för rapporter Dren pushar SJÄLV med push.bat
  # (egna credentials ⇒ workflows triggas normalt). Den är alltså inte död,
  # bara otillräcklig ensam.
  push:
    branches: [main]
    paths:
      - "reports/daily/**"
      - "reports/weekly/**"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bygg digest ur dagens rapport (LLM-fritt, inga tokens)
        run: node .github/scripts/digest.mjs
      - name: Skapa issue (ger e-postnotis), hoppa över dubbletter
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let d = null;
            try { d = JSON.parse(fs.readFileSync((process.env.RUNNER_TEMP || '.') + '/digest.json', 'utf8')); } catch (e) {}
            if (!d || !d.title) { core.info('Ingen rapport för idag – ingen digest.'); return; }
            // Dubblett-skydd: en digest per rapportdag (sök i alla issues, även stängda).
            const q = `repo:${context.repo.owner}/${context.repo.repo} in:title "${d.title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            if (found.data.total_count > 0) { core.info('Digest finns redan: ' + d.title); return; }
            const issue = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title: d.title, body: d.body });
            // Stäng direkt – e-postnotisen skickas ändå och issue-listan hålls ren.
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.data.number, state: 'closed' });
            core.info('Digest skickad och stängd: #' + issue.data.number);
