name: Auto-merge claude-brancher till main

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:   # manuell körning mergar ALLA befintliga claude/-brancher

permissions:
  contents: write

concurrency:
  group: automerge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repot (alla brancher)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # KRÄVS av grinden nedan. GitHub startar medvetet INGA workflows för pushar
      # gjorda med den inbyggda GITHUB_TOKEN (skydd mot rekursiva körningar), och
      # både test.yml och dashboard.yml lyssnar på push mot main. Följden var att
      # varje routine-commit som nådde main via den här actionen hoppade över BÅDE
      # valideringen och ombyggnaden av dashboard.json – CI var i praktiken avstängt
      # för allt systemet självt producerar (veckorapport-260803 punkt 8). Vi kan
      # inte få GitHub att trigga workflowsen, så vi kör dem HÄR i stället.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Merga till main och ta bort branchen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manuell körning: plocka upp alla befintliga claude/-brancher
            BRANCHES=$(git branch -r | grep 'origin/claude/' | sed 's|.*origin/||' || true)
          else
            # Automatisk körning: branchen som just pushades
            BRANCHES="${GITHUB_REF_NAME}"
          fi

          if [ -z "$BRANCHES" ]; then
            echo "Inga claude/-brancher att merga. Klart."
            exit 0
          fi

          FAIL=0
          for BRANCH in $BRANCHES; do
            echo "==> Mergar $BRANCH till main"
            if ! git merge "origin/$BRANCH" -m "Auto-merge: $BRANCH -> main"; then
              # ---- KONFLIKT I EN GENERERAD FIL AR INTE EN RIKTIG KONFLIKT ---------
              # De filer som ar markta `-merge` i .gitattributes kan per definition
              # ALDRIG auto-mergas: markningen stanger av den textuella mergen just
              # for att slippa konfliktmarkorer mitt i JSON:en. Foljden var att varje
              # claude-branch som rort en sadan fil blockerade hela mergen.
              #
              # Det hande 2026-08-25T23:10 (korning 32909555257):
              #   warning: Cannot merge binary files: state/decision_eval.json
              #   CONFLICT (content): Merge conflict in state/decision_eval.json
              # Branchen claude/beslutsmatning-oberoende-fonster lamnades kvar och nadde
              # main forst efter en manuell omkorning. Grinden hade redan en losning for
              # dashboard.json (bygg om efteran) men ingen for sjalva MERGEN.
              #
              # Losningen: for GENERERADE filer ar mains version alltid ratt utgangslage
              # - main skrivs av prices.yml var 30:e minut, branchens kopia ar per
              # definition aldre - och innehallet byggs anda om efterat. Allt ANNAT
              # avbryter som forut. Grinden gissar aldrig i en rapport, en portfolj
              # eller en beslutslogg.
              #
              # scout_candidates.json star MEDVETET INTE i listan: den ar inte genererad,
              # utan bar routinens egna avgoranden (promoted/rejected med skal). Att ta
              # mains version dar hade kastat bort precis det arbete branchen gjorde.
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              SAFE="state/dashboard.json state/search-index.json state/decision_eval.json state/earnings_calendar.json state/push_sent.json state/push_subs.json"
              UNSAFE=""
              for f in $CONFLICTS; do
                case " $SAFE " in *" $f "*) ;; *) UNSAFE="$UNSAFE $f" ;; esac
              done
              if [ -n "$UNSAFE" ] || [ -z "$CONFLICTS" ]; then
                git merge --abort
                echo "::error::Mergekonflikt i $BRANCH utanfor de genererade filerna:$UNSAFE - branchen lamnas kvar for manuell hantering."
                FAIL=1
                continue
              fi
              echo "Konflikt enbart i genererade filer - tar mains version och bygger om: $CONFLICTS"
              for f in $CONFLICTS; do
                git checkout --ours -- "$f"
                git add "$f"
              done
              if ! git commit -m "Auto-merge: $BRANCH -> main (genererade filer tagna fran main)"; then
                git merge --abort
                echo "::error::Kunde inte slutfora mergen for $BRANCH - branchen lamnas kvar."
                FAIL=1
                continue
              fi
            fi

            # ---- GRINDEN: samma kontroller som test.yml skulle ha kort ----------
            # Faller nagon av dem SKA ingenting pushas. Poangen med valideringen ar
            # att en trasig decisions.json eller en trasig ren funktion inte ska na
            # main - och den poangen forsvann helt nar pushen inte triggade CI.
            # Vid fel: mergen kastas lokalt, branchen lamnas KVAR (inget arbete
            # forsvinner) och jobbet failar synligt i Actions.
            if ! node .github/scripts/validate-decisions.mjs; then
              echo "::error::validate-decisions.mjs failade for $BRANCH - INGET pushat. Branchen ligger kvar."
              git reset --hard origin/main
              FAIL=1
              continue
            fi
            # Bryggan scout -> bok. Utan den har kontrollen kan en routine skriva
            # en kandidat med uppfunnet enum-varde eller promota en utan verifierad
            # kurs, och bada nar main utan att nagot sager ifran.
            if ! node .github/scripts/validate-scout-candidates.mjs; then
              echo "::error::validate-scout-candidates.mjs failade for $BRANCH - INGET pushat. Branchen ligger kvar."
              git reset --hard origin/main
              FAIL=1
              continue
            fi
            # Atgardsloopen. Filen skrivs av miss-retron; ett uppfunnet status-varde
            # eller ett dubblerat id gor watchdogens larm tyst utan att nagot blir rott.
            if ! node .github/scripts/validate-action-items.mjs; then
              echo "::error::validate-action-items.mjs failade for $BRANCH - INGET pushat. Branchen ligger kvar."
              git reset --hard origin/main
              FAIL=1
              continue
            fi
            if ! node tests/run.mjs; then
              echo "::error::tests/run.mjs failade for $BRANCH - INGET pushat. Branchen ligger kvar."
              git reset --hard origin/main
              FAIL=1
              continue
            fi
            # tests/data.mjs korrs medvetet INTE har: den hamtar ~110 filer over
            # natet och ar darmed bade langsam och beroende av att raw.github svarar.
            # Den halls kvar i test.yml, som gar pa pushar med Drens credentials.
            if ! node tests/theme.mjs; then
              echo "::error::tests/theme.mjs failade for $BRANCH - INGET pushat. Branchen ligger kvar."
              git reset --hard origin/main
              FAIL=1
              continue
            fi

            # ---- Dashboard-bygget, som dashboard.yml annars hade gjort ----------
            # Utan detta ligger state/dashboard.json kvar pa forra versionen och
            # appen visar gammal data tills nagon pushar med egna credentials.
            if node .github/scripts/build-dashboard.mjs; then
              git add state/dashboard.json state/search-index.json
              if ! git diff --cached --quiet; then
                git commit -m "Dashboard-data efter auto-merge: $BRANCH"
              fi
            else
              echo "::warning::build-dashboard.mjs failade - dashboard.json kan ligga efter. Mergen pushas anda."
            fi

            # ---- Beslutsutvarderingen, av samma skal som dashboard-bygget --------
            # decision_eval.json ar en REN FUNKTION av decisions.json + price_history.json.
            # Branchen har just lagt till rader i beslutsloggen, och om konflikten ovan
            # loste filen med MAINS version speglar den nu ett aldre underlag. Skriptet
            # skriver bara vid faktisk andring, sa det ar gratis nar inget hant.
            # Utan detta steg lag filen efter till nasta prices.yml-korning, och
            # watchdogens checkDecisionEval hade larmat pa vart eget merge-beteende.
            if node .github/scripts/decision_eval.mjs; then
              git add state/decision_eval.json
              if ! git diff --cached --quiet; then
                git commit -m "Beslutsutvardering efter auto-merge: $BRANCH"
              fi
            else
              echo "::warning::decision_eval.mjs failade - decision_eval.json kan ligga efter. Mergen pushas anda."
            fi

            # ---- PUSH MED RETRY -------------------------------------------------
            # Ett naket "git push origin main" forlorar mot varje samtidig push, och
            # de ar manga: kurser var 30:e minut, nyheter varannan timme, monitorn
            # varje timme under borstid. Korning 31189191076 (2026-08-07) foll pa
            # exakt det - "! [rejected] main -> main (fetch first)" - efter att ha
            # klarat HELA grinden. Rapporten nar da aldrig main av sig sjalv:
            # branchen ligger kvar tills nagon markt det och kort workflow_dispatch.
            # Risken ar storst pa mandagar, nar bada veckorotationerna och
            # allokeringen ligger samma dag. monitor.yml har haft den har slingan
            # hela tiden; grinden hade den inte.
            #
            # state/dashboard.json och search-index.json ar GENERERADE och markta
            # -merge i .gitattributes: de far ALDRIG handmergas. Efter en rebase
            # byggs de darfor om mot det nya tradet i stallet for att valjas fran
            # nagon sida - samma regel som push.bat foljer lokalt.
            PUSHAD=0
            for i in 1 2 3; do
              if git push origin main; then PUSHAD=1; break; fi
              echo "Push-forsok $i misslyckades (kollision med annan push?) - hamtar och forsoker igen..."
              sleep $((5 * i))
              if ! git pull --rebase --autostash -X theirs origin main; then
                git rebase --abort 2>/dev/null || true
                echo "::error::Rebase mot main misslyckades for $BRANCH - branchen ligger kvar."
                break
              fi
              if node .github/scripts/build-dashboard.mjs; then
                git add state/dashboard.json state/search-index.json
                if ! git diff --cached --quiet; then
                  git commit -m "Dashboard-data ombyggd efter push-kollision: $BRANCH"
                fi
              fi
            done
            if [ "$PUSHAD" != "1" ]; then
              echo "::error::Kunde inte pusha $BRANCH till main efter 3 forsok - INGET pushat. Branchen ligger kvar."
              git reset --hard origin/main
              FAIL=1
              continue
            fi

            git push origin --delete "$BRANCH"
            echo "==> Klart: $BRANCH mergad, validerad, dashboard ombyggd och branchen borttagen."
          done
          exit $FAIL
