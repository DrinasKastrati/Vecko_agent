name: Hämta nyheter (news_feed.json)

on:
  schedule:
    # Varannan timme under den aktiva handelsdagen (Europa + USA), vardagar.
    - cron: "17 5-21/2 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full historik – krävs för rebase mot samtidiga pushar
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Hämta nyhetsflöden
        run: node .github/scripts/fetch-news.mjs
      - name: Committa news_feed.json om ändrad
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/news_feed.json
          if git diff --cached --quiet; then
            echo "Inga nyhetsandringar - hoppar over commit."
          else
            git commit -m "Nyheter: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push origin main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push-försök $i misslyckades – försöker igen..."
              sleep $((5 * i))
            done
            echo "Kunde inte pusha efter 3 försök."
            exit 1
          fi
