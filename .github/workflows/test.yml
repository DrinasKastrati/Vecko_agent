name: Tester (webbapp + skript)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # föregående commit krävs för append-only-kontrollen nedan
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Kör testsviten (rena funktioner, ingen nätåtkomst)
        run: node tests/run.mjs
      - name: Kontrollera temalagret (tokentäckning; jsdom-delen hoppas över i CI)
        run: node tests/theme.mjs
      - name: Kontrollera datalagret (hoppas över utan jsdom)
        run: node tests/data.mjs
      - name: Bygg dashboard-data och verifiera att den blir läsbar
        run: node .github/scripts/build-dashboard.mjs
      - name: Validera beslutsdatabasen (schema + append-only mot föregående commit)
        run: |
          git show HEAD~1:state/decisions.json > /tmp/decisions-base.json 2>/dev/null || true
          if [ -s /tmp/decisions-base.json ]; then
            node .github/scripts/validate-decisions.mjs --base /tmp/decisions-base.json
          else
            node .github/scripts/validate-decisions.mjs
          fi
      - name: Syntaxkontrollera alla JS-moduler
        run: |
          node --check assets/vparse.js
          node --check assets/vrender.js
          node --check assets/app.js
          node --check assets/theme.js
          node --check assets/settings.js
          node --check sw.js
          node --check .github/scripts/build-dashboard.mjs
          node --check .github/scripts/fetch-prices.mjs
          node --check .github/scripts/alerts.mjs
          node --check .github/scripts/digest.mjs
          node --check .github/scripts/watchdog.mjs
          node --check .github/scripts/fetch-news.mjs
          node --check .github/scripts/backtest.mjs
          node --check .github/scripts/validate-decisions.mjs
