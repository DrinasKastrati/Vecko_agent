name: Veckans rörelser (movers.json)

on:
  schedule:
    # Lördag 06:00 UTC – efter fredagens stängningskurser (21:10 UTC fredag) och
    # FÖRE miss-retron (lördag 10:00 CEST = 08:00 UTC), som läser filen i STEG 1.
    - cron: "0 6 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: movers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full historik – krävs för rebase mot samtidiga pushar
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Hämta veckans rörelser i det breddade nordiska universumet
        run: node .github/scripts/movers.mjs
      - name: Committa movers.json om ändrad
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/movers.json
          if git diff --cached --quiet; then
            echo "Inga andringar - hoppar over commit."
          else
            git commit -m "Veckans rörelser: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              if git pull --rebase --autostash -X theirs origin main && git push origin main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push-försök $i misslyckades – försöker igen..."
              sleep $((5 * i))
            done
            echo "Kunde inte pusha efter 3 försök."
            exit 1
          fi
